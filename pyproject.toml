[project]
name = "story2audio"
version = "3.0.0"
description = "Ứng dụng FastAPI chuyển văn bản thành audio MP3 với streaming, cache và phụ đề trực tiếp (Live Subtitles)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "edge-tts>=7.2.8",
  "fastapi>=0.115.0",
  "gtts>=2.5.4",
  "python-dotenv>=1.1.0",
  "uvicorn[standard]>=0.34.0",
  # NEW DEPENDENCIES for document upload
  "PyPDF2>=3.0.1",
  "pdfplumber>=0.11.0",
  "ebooklib>=0.18",
  "python-magic>=0.4.27",  # For future file type validation (MVP: not yet used)
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
